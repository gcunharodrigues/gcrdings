name: Release gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualified-build:
    name: Qualified macOS build and release gates
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: brew install cmake
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: ./scripts/bootstrap-dev.sh
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Provision pinned FFmpeg input
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg80arm.zip"
          extracted="$RUNNER_TEMP/ffmpeg80arm"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/Zackriya-Solutions/ffmpeg-binaries/releases/download/0.0.1/ffmpeg80arm.zip \
            --output "$archive"
          mkdir -m 0700 "$extracted"
          ditto -x -k "$archive" "$extracted"
          find "$extracted" -type f -name ffmpeg -print >"$RUNNER_TEMP/ffmpeg-files"
          test "$(wc -l <"$RUNNER_TEMP/ffmpeg-files" | tr -d ' ')" = 1
          ffmpeg_source=$(head -n 1 "$RUNNER_TEMP/ffmpeg-files")
          test "$(shasum -a 256 "$ffmpeg_source" | awk '{print $1}')" = \
            77d2c853f431318d55ec02676d9b2f185ebfdddb9f7677a251fbe453affe025a
          echo "GCRDINGS_FFMPEG_SOURCE=$ffmpeg_source" >>"$GITHUB_ENV"
      - run: ./scripts/prepare-foundation-helper.sh
      - name: Stage verified FFmpeg beside Cargo test binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/debug/deps
          cp "$GCRDINGS_FFMPEG_SOURCE" target/debug/deps/ffmpeg
          chmod 0755 target/debug/deps/ffmpeg
          test "$(shasum -a 256 target/debug/deps/ffmpeg | awk '{print $1}')" = \
            77d2c853f431318d55ec02676d9b2f185ebfdddb9f7677a251fbe453affe025a
      - run: ./scripts/verify-release-gates.sh
